<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>لوحة التحكم - تقنية الارتفاع</title>
  <meta name="robots" content="noindex, nofollow" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet" />

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Custom Styles -->
  <style>
    * {
      font-family: "Tajawal", sans-serif;
    }

    :root {
      --primary-green: #004d40;
      --primary-gold: #b8952b;
      --light-gold: #d4af37;
      --dark-green: #00332a;
    }

    html {
      scroll-behavior: smooth;
    }

    .gradient-text {
      background: linear-gradient(135deg, var(--primary-gold) 0%, var(--light-gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .sidebar-transition {
      transition: transform 0.3s ease-in-out;
    }

    .modal-overlay {
      backdrop-filter: blur(4px);
    }

    .form-input {
      transition: all 0.3s ease;
    }

    .form-input:focus {
      border-color: var(--primary-green);
      box-shadow: 0 0 0 3px rgba(0, 77, 64, 0.1);
    }
  </style>
</head>

<body class="bg-gray-50">
  <!-- Login Modal -->
  <div id="loginModal" class="fixed inset-0 bg-black bg-opacity-50 modal-overlay z-50 flex items-center justify-center">
    <div class="bg-white rounded-xl shadow-2xl p-6 sm:p-8 w-full max-w-md mx-4">
      <div class="text-center mb-6">
        <div class="w-16 h-16 bg-gradient-to-r from-[#004d40] to-[#00332a] rounded-full flex items-center justify-center mx-auto mb-4">
          <i class="fas fa-lock text-white text-2xl"></i>
        </div>
        <h2 class="text-2xl font-bold text-gray-900">دخول لوحة التحكم</h2>
        <p class="text-gray-600 mt-2">أدخل كلمة المرور للمتابعة</p>
      </div>

      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">كلمة المرور</label>
          <input type="password" id="password" required class="w-full px-4 py-3 border border-gray-300 rounded-lg form-input" placeholder="أدخل كلمة المرور" />
        </div>

        <button type="submit" class="w-full bg-gradient-to-r from-[#004d40] to-[#00332a] text-white py-3 rounded-lg font-medium hover:shadow-lg transition-all">
          <i class="fas fa-sign-in-alt ml-2"></i> دخول
        </button>
      </form>

      <div id="loginError" class="mt-4 text-red-600 text-sm text-center hidden">
        كلمة المرور غير صحيحة
      </div>
    </div>
  </div>

  <!-- Main Admin Interface -->
  <div id="adminInterface" class="hidden min-h-screen bg-gray-50">
    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-gray-200">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
          <!-- Logo and Title -->
          <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-gradient-to-r from-[#004d40] to-[#00332a] rounded-lg flex items-center justify-center">
              <i class="fas fa-cog text-white text-sm"></i>
            </div>
            <h1 class="text-xl font-bold text-gray-900">لوحة التحكم</h1>
          </div>

          <!-- User Menu -->
          <div class="flex items-center gap-4">
            <a href="index.html" target="_blank" rel="noopener" class="inline-flex items-center gap-2 px-4 py-2 text-sm font-medium text-[#004d40] bg-emerald-50 hover:bg-emerald-100 rounded-lg transition-colors">
              <i class="fas fa-external-link-alt"></i>
              <span>View Site</span>
            </a>
            <span class="text-sm text-gray-600">مرحباً، المدير</span>
            <button id="logoutBtn" class="px-4 py-2 text-sm text-red-600 hover:bg-red-50 rounded-lg transition-colors">
              <i class="fas fa-sign-out-alt ml-1"></i> خروج
            </button>
          </div>
        </div>
      </div>
    </header>

    <div class="flex">
      <!-- Sidebar -->
      <aside id="sidebar" class="w-64 bg-white shadow-sm border-r border-gray-200 min-h-screen">
        <nav class="p-4">
          <div class="mb-6 border-b border-gray-100 pb-5">
            <a href="index.html" class="flex items-center justify-center rounded-lg p-2 hover:bg-gray-50 transition-colors" aria-label="تقنية الارتفاع">
              <img src="assets/logo.png" alt="تقنية الارتفاع" class="h-14 w-auto object-contain" />
            </a>
          </div>
          <ul class="space-y-2">
            <li>
              <button data-section="dashboard" class="nav-item w-full flex items-center gap-3 px-4 py-3 text-right rounded-lg hover:bg-gray-50 transition-colors active">
                <i class="fas fa-tachometer-alt text-gray-500 w-5"></i>
                <span class="text-sm font-medium">لوحة المعلومات</span>
              </button>
            </li>
            <li>
              <button data-section="hero-slides" class="nav-item w-full flex items-center gap-3 px-4 py-3 text-right rounded-lg hover:bg-gray-50 transition-colors">
                <i class="fas fa-images text-gray-500 w-5"></i>
                <span class="text-sm font-medium">Hero Slider</span>
              </button>
            </li>
            <li>
              <button data-section="services" class="nav-item w-full flex items-center gap-3 px-4 py-3 text-right rounded-lg hover:bg-gray-50 transition-colors">
                <i class="fas fa-cogs text-gray-500 w-5"></i>
                <span class="text-sm font-medium">إدارة الخدمات</span>
              </button>
            </li>
            <li>
              <button data-section="products" class="nav-item w-full flex items-center gap-3 px-4 py-3 text-right rounded-lg hover:bg-gray-50 transition-colors">
                <i class="fas fa-box text-gray-500 w-5"></i>
                <span class="text-sm font-medium">إدارة المنتجات</span>
              </button>
            </li>
            <li>
              <button data-section="projects" class="nav-item w-full flex items-center gap-3 px-4 py-3 text-right rounded-lg hover:bg-gray-50 transition-colors">
                <i class="fas fa-briefcase text-gray-500 w-5"></i>
                <span class="text-sm font-medium">إدارة المشاريع</span>
              </button>
            </li>
            <li>
              <button data-section="testimonials" class="nav-item w-full flex items-center gap-3 px-4 py-3 text-right rounded-lg hover:bg-gray-50 transition-colors">
                <i class="fas fa-star text-gray-500 w-5"></i>
                <span class="text-sm font-medium">إدارة التقييمات</span>
              </button>
            </li>
            <li>
              <button data-section="partners" class="nav-item w-full flex items-center gap-3 px-4 py-3 text-right rounded-lg hover:bg-gray-50 transition-colors">
                <i class="fas fa-handshake text-gray-500 w-5"></i>
                <span class="text-sm font-medium">إدارة شركاء النجاح</span>
              </button>
            </li>
            <li>
              <button data-section="media" class="nav-item w-full flex items-center gap-3 px-4 py-3 text-right rounded-lg hover:bg-gray-50 transition-colors">
                <i class="fas fa-images text-gray-500 w-5"></i>
                <span class="text-sm font-medium">إدارة الوسائط</span>
              </button>
            </li>
            <li>
              <button data-section="settings" class="nav-item w-full flex items-center gap-3 px-4 py-3 text-right rounded-lg hover:bg-gray-50 transition-colors">
                <i class="fas fa-cog text-gray-500 w-5"></i>
                <span class="text-sm font-medium">الإعدادات</span>
              </button>
            </li>
          </ul>
        </nav>
      </aside>

      <!-- Main Content -->
      <main class="flex-1 p-6">
        <!-- Dashboard Section -->
        <div id="dashboard-section" class="section">
          <div class="mb-6">
            <h2 class="text-2xl font-bold text-gray-900 mb-2">لوحة المعلومات</h2>
            <p class="text-gray-600">نظرة عامة على الموقع والمحتوى</p>
          </div>

          <!-- Quick Actions -->
          <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
            <h3 class="text-lg font-bold text-gray-900 mb-4">إجراءات سريعة</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
              <button onclick="showSection('services')" class="p-4 border border-gray-200 rounded-lg hover:bg-gray-50 transition-colors text-right">
                <i class="fas fa-plus text-green-600 mb-2 block"></i>
                <span class="text-sm font-medium">إضافة خدمة جديدة</span>
              </button>
              <button onclick="showSection('products')" class="p-4 border border-gray-200 rounded-lg hover:bg-gray-50 transition-colors text-right">
                <i class="fas fa-plus text-blue-600 mb-2 block"></i>
                <span class="text-sm font-medium">إضافة منتج جديد</span>
              </button>
              <button onclick="showSection('projects')" class="p-4 border border-gray-200 rounded-lg hover:bg-gray-50 transition-colors text-right">
                <i class="fas fa-plus text-yellow-600 mb-2 block"></i>
                <span class="text-sm font-medium">إضافة مشروع جديد</span>
              </button>
            </div>
          </div>
        </div>

        <!-- Placeholder for other sections -->
        <div id="services-section" class="section hidden">
          <h2 class="text-2xl font-bold text-gray-900 mb-2">إدارة الخدمات</h2>
        </div>

        <div id="products-section" class="section hidden">
          <h2 class="text-2xl font-bold text-gray-900 mb-2">إدارة المنتجات</h2>
        </div>

        <div id="projects-section" class="section hidden">
          <h2 class="text-2xl font-bold text-gray-900 mb-2">إدارة المشاريع</h2>
        </div>

        <div id="testimonials-section" class="section hidden">
          <h2 class="text-2xl font-bold text-gray-900 mb-2">إدارة التقييمات</h2>
        </div>

        <div id="partners-section" class="section hidden">
          <h2 class="text-2xl font-bold text-gray-900 mb-2">إدارة شركاء النجاح</h2>
        </div>

        <div id="media-section" class="section hidden">
          <h2 class="text-2xl font-bold text-gray-900 mb-2">إدارة الوسائط</h2>
        </div>

        <div id="hero-slides-section" class="section hidden">
          <h2 class="text-2xl font-bold text-gray-900 mb-2">Hero Slider</h2>
        </div>

        <div id="settings-section" class="section hidden">
          <h2 class="text-2xl font-bold text-gray-900 mb-2">الإعدادات</h2>
        </div>
      </main>
    </div>
  </div>

  <script>
    // Admin Password - Set to 123321
    const ADMIN_PASSWORD = "123321";

    // Login Form Handler
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const loginError = document.getElementById('loginError');

      if (password === ADMIN_PASSWORD) {
        loginError.classList.add('hidden');
        document.getElementById('loginModal').classList.add('hidden');
        document.getElementById('adminInterface').classList.remove('hidden');
        localStorage.setItem('adminLoggedIn', 'true');
      } else {
        loginError.classList.remove('hidden');
        document.getElementById('password').value = '';
      }
    });

    // Check if already logged in
    window.addEventListener('DOMContentLoaded', function() {
      if (localStorage.getItem('adminLoggedIn') === 'true') {
        document.getElementById('loginModal').classList.add('hidden');
        document.getElementById('adminInterface').classList.remove('hidden');
      }
    });

    // Logout Handler
    document.getElementById('logoutBtn').addEventListener('click', function() {
      localStorage.removeItem('adminLoggedIn');
      document.getElementById('adminInterface').classList.add('hidden');
      document.getElementById('loginModal').classList.remove('hidden');
      document.getElementById('password').value = '';
    });

    // Navigation Handler
    document.querySelectorAll('.nav-item').forEach(button => {
      button.addEventListener('click', function() {
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        
        const section = this.getAttribute('data-section');
        document.querySelectorAll('.section').forEach(s => s.classList.add('hidden'));
        document.getElementById(section + '-section').classList.remove('hidden');
      });
    });

    // Show Section Function
    function showSection(sectionName) {
      document.querySelectorAll('.section').forEach(s => s.classList.add('hidden'));
      document.getElementById(sectionName + '-section').classList.remove('hidden');
      
      const navButton = document.querySelector(`[data-section="${sectionName}"]`);
      if (navButton) {
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
        navButton.classList.add('active');
      }
    }
  </script>
</body>

</html>
