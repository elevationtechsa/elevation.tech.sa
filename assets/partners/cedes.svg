<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" class="w-full h-full">
  <defs>
    <linearGradient id="cedesGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#334155;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="80" fill="url(#cedesGradient)" rx="8"/>

  <!-- Logo Text -->
  <text x="100" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">CEDES</text>
  <text x="100" y="45" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#e2e8f0">CONTROLS</text>

  <!-- Decorative elements - Control panel -->
  <rect x="25" y="25" width="15" height="8" fill="white" rx="1"/>
  <rect x="25" y="37" width="15" height="8" fill="white" rx="1"/>
  <circle cx="32.5" cy="29" r="1.5" fill="#0f172a"/>
  <circle cx="32.5" cy="41" r="1.5" fill="#0f172a"/>

  <rect x="160" y="25" width="15" height="8" fill="white" rx="1"/>
  <rect x="160" y="37" width="15" height="8" fill="white" rx="1"/>
  <circle cx="167.5" cy="29" r="1.5" fill="#0f172a"/>
  <circle cx="167.5" cy="41" r="1.5" fill="#0f172a"/>
</svg>