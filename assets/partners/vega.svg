<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" class="w-full h-full">
  <defs>
    <linearGradient id="vegaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="80" fill="url(#vegaGradient)" rx="8"/>

  <!-- Logo Text -->
  <text x="100" y="25" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">VEGA</text>
  <text x="100" y="45" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#d1fae5">ELEVATORS</text>

  <!-- Decorative elements - Stylized V -->
  <path d="M30 65 L50 25 L70 65" fill="none" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <path d="M130 65 L150 25 L170 65" fill="none" stroke="white" stroke-width="4" stroke-linecap="round"/>

  <!-- Small circles -->
  <circle cx="30" cy="25" r="3" fill="white"/>
  <circle cx="70" cy="25" r="3" fill="white"/>
  <circle cx="130" cy="25" r="3" fill="white"/>
  <circle cx="170" cy="25" r="3" fill="white"/>
</svg>