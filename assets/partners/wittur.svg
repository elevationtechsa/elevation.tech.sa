<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" class="w-full h-full">
  <defs>
    <linearGradient id="witturGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="80" fill="url(#witturGradient)" rx="8"/>

  <!-- Logo Text -->
  <text x="100" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">WITTUR</text>
  <text x="100" y="45" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#e9d5ff">DOOR SYSTEMS</text>

  <!-- Decorative elements - Door representation -->
  <rect x="25" y="20" width="20" height="40" fill="none" stroke="white" stroke-width="3" rx="2"/>
  <rect x="155" y="20" width="20" height="40" fill="none" stroke="white" stroke-width="3" rx="2"/>

  <!-- Door handles -->
  <circle cx="35" cy="40" r="2" fill="white"/>
  <circle cx="165" cy="40" r="2" fill="white"/>
</svg>