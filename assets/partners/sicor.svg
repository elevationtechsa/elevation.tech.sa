<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" class="w-full h-full">
  <defs>
    <linearGradient id="sicorGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="80" fill="url(#sicorGradient)" rx="8"/>

  <!-- Logo Text -->
  <text x="100" y="30" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="white">SICOR</text>
  <text x="100" y="50" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#fed7d7">ELEVATOR CONTROLS</text>

  <!-- Decorative elements -->
  <rect x="20" y="20" width="8" height="40" fill="white" rx="2"/>
  <rect x="32" y="20" width="8" height="30" fill="white" rx="2"/>
  <rect x="44" y="20" width="8" height="35" fill="white" rx="2"/>

  <rect x="148" y="20" width="8" height="40" fill="white" rx="2"/>
  <rect x="160" y="20" width="8" height="30" fill="white" rx="2"/>
  <rect x="172" y="20" width="8" height="35" fill="white" rx="2"/>
</svg>