<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة الموقع | تقنية الارتفاع</title><meta name="robots" content="noindex, nofollow"><link rel="icon" href="/assets/logo.png"><link rel="stylesheet" href="/assets/admin.css"><script src="/assets/admin.js" defer></script></head>
<body><header><a class="brand" href="/"><img src="/assets/logo.png" alt="" width="44" height="44"><span>تقنية الارتفاع <small>إدارة الموقع والمقالات</small></span></a><a href="/blog/" target="_blank" rel="noopener">عرض المدونة ↗</a><a href="/" target="_blank" rel="noopener">عرض الموقع ↗</a><button id="logout" class="quiet" hidden>تسجيل الخروج</button></header>
<div id="notice" role="status" aria-live="polite"></div>
<main id="login-view" class="login"><section class="panel"><p class="eyebrow">مرحباً بعودتك</p><h1>دخول لوحة التحكم</h1><p>سجّل الدخول لإدارة محتوى الموقع ونشر المقالات.</p><form id="login-form"><label for="password">كلمة المرور</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128"><button type="submit">تسجيل الدخول</button></form><p class="muted">استخدم بيانات الدخول التي زُودت بها لإدارة الموقع.</p></section></main>
<div id="app" hidden><aside><nav id="tabs" aria-label="أقسام الإدارة"></nav><div class="aside-bottom"><button id="refresh" class="quiet">تحديث المحتوى</button><button id="export" class="quiet">تنزيل نسخة من المحتوى</button><button id="legacy" class="quiet" hidden>تنزيل المحتوى المحلي القديم</button><p id="revision" class="muted"></p></div></aside><main id="workspace"><div class="page-head"><div><p class="eyebrow">لوحة التحكم</p><h1 id="section-title"></h1></div><button id="add-item" hidden>إضافة جديد +</button></div><div id="section-body"></div></main></div>
<dialog id="editor"><form id="editor-form"><div class="dialog-head"><h2 id="editor-title"></h2><button type="button" id="close-editor" class="quiet" aria-label="إغلاق">×</button></div><div id="editor-fields"></div><p id="editor-error" class="error" role="alert"></p><div class="actions"><button type="submit" id="save-item">حفظ التغييرات</button><button type="button" id="cancel-editor" class="quiet">إلغاء</button></div></form></dialog>
<noscript><p>يرجى تفعيل JavaScript لاستخدام لوحة التحكم.</p></noscript></body></html>
